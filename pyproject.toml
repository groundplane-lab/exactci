[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exactci"
version = "0.1.0"
description = "Exact confidence intervals for odds ratios and relative risk in 2x2 tables (free core)"
readme = "README.md"
authors = [{name = "Groundplane Labs"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
keywords = ["confidence interval", "odds ratio", "relative risk", "cornfield", "koopman", "contingency table", "statistics", "biostatistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://groundplane0.gumroad.com/l/verudy"

[tool.setuptools.packages.find]
where = ["src"]
